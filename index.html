<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Dream Home Enterprises</title>
  <link rel="stylesheet" href="css/style.css">
  <noscript><style>body { visibility: visible; }</style></noscript>
</head>
<body>
  <div class="shell">
    <nav id="nav" class="sidebar" aria-label="Main"></nav>

    <main class="main main-wide">
      <header class="page-header page-header-row">
        <div>
          <h1>Dashboard</h1>
          <p id="month-label" class="muted"></p>
        </div>
        <div class="header-actions">
          <span id="updated" class="muted"></span>
          <button id="refresh-btn" class="btn btn-quiet" type="button">Refresh</button>
        </div>
      </header>

      <section id="tiles" class="tiles" aria-label="Key figures"></section>

      <div class="dash-grid">
        <section class="card" aria-labelledby="pipeline-title">
          <h2 id="pipeline-title">Lead pipeline</h2>
          <div id="pipeline"></div>
        </section>

        <section class="card" aria-labelledby="leads-title">
          <h2 id="leads-title">Recent leads</h2>
          <div id="recent-leads"></div>
          <p class="card-link"><a href="leads.html">All leads</a></p>
        </section>

        <section class="card dash-wide" aria-labelledby="orders-title">
          <h2 id="orders-title">Recent orders</h2>
          <div id="recent-orders"></div>
          <p class="card-link"><a href="orders.html">All orders</a></p>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
