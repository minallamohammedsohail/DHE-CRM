<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Dream Home Enterprises</title>
  <link rel="stylesheet" href="css/style.css">
  <noscript><style>body { visibility: visible; }</style></noscript>
</head>
<body>
  <div class="shell">
    <nav id="nav" class="sidebar" aria-label="Main"></nav>

    <main class="main">
      <header class="page-header">
        <h1>Dashboard</h1>
        <p class="muted">Dream Home Enterprises</p>
      </header>

      <section class="card">
        <h2>Setup complete</h2>
        <p>You are signed in. The dashboard widgets are built last, once leads, customers, follow-ups and orders are working.</p>
        <p id="signed-in-as" class="muted"></p>
      </section>
    </main>
  </div>

  <script type="module">
    import { requireAuth, renderNav } from './js/app.js';

    const user = await requireAuth();
    if (user) {
      renderNav(user);
      document.getElementById('signed-in-as').textContent = `Signed in as ${user.email}`;
    }
  </script>
</body>
</html>
