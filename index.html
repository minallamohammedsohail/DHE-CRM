<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tile CRM</title>
  <style>
    :root { --navy: #14213d; --bg: #f6f7f9; --card: #ffffff; --line: #e4e7ec; --muted: #5b6472; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--navy);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 32px; max-width: 420px; width: 100%;
      box-shadow: 0 1px 2px rgba(20, 33, 61, .06);
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0; color: var(--muted); font-size: 14px; }
    .tag {
      display: inline-block; margin-bottom: 16px; padding: 2px 10px; border-radius: 999px;
      background: #eef1f6; color: var(--muted); font-size: 12px; letter-spacing: .02em;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">Phase 0</span>
    <h1>Tile CRM</h1>
    <p>Deployment pipeline verified. The application is not built yet.</p>
  </main>
</body>
</html>
